# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml
[mgr]
ratio          = [ 1, 4, 3 ]
show_hidden    = true

# run ya cache clear to take effect of preview changes
[preview]
max_width       = 600
max_height      = 900

[plugin]
prepen_fetchers = [
	{ url = "*",         run = "git", group = "git" },
	{ url = "*/",         run = "git", group = "git" },
]
